  <div class="bottom">
    <input type="range" id="progressBar" value="0">
    <div class="icons">
      <i class="fa-solid fa-3x fa-backward" id="backward"></i>
      <i class="fa-solid fa-3x fa-circle-play" id="playCircle"></i>
      <i class="fa-solid fa-3x fa-forward" id="forward"></i>
      <div class="nowPlaying">
        <img src="vol.gif" alt="" id="gif">
        <span id="songText">Let Me Love You</span>
      </div>
      <div class="volume-control">
        <i class="fa-solid fa-volume-high" id="muteBtn"></i>
        <input type="range" id="volumeSlider" min="0" max="100" value="50">
      </div>
    </div>
